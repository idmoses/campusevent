<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet"><title>Sign in | CampusConnect</title></head>
<body><div class="auth-wrap"><aside class="auth-brand"><div class="fs-5 fw-bold"><i class="bi bi-calendar2-event me-2 accent"></i>CampusConnect</div>
<div><h1>Every campus event, in one place.</h1><p class="mt-3 opacity-75">Find events, secure your seat, and check in with a code.</p></div>
<small class="opacity-50">&copy; CampusConnect</small></aside>
<main class="auth-form"><div class="card-soft">
<h2 class="h3">Sign in</h2><p class="text-muted">Use your student or staff account.</p>
<form id="loginForm" novalidate>
<div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" type="email" required autocomplete="email"></div>
<div class="mb-2"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password"></div>
<div class="text-end mb-3"><a href="forgot-password.html" class="small">Forgot password?</a></div>
<button class="btn btn-primary w-100" id="submitBtn" type="submit">Sign in</button></form>
<p class="text-center text-muted mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="assets/js/auth/login-page.js"></script></body></html>
