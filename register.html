<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <title>Create account | CampusConnect</title>
</head>

<body>
    <div class="auth-wrap">
        <aside class="auth-brand">
            <div class="fs-5 fw-bold"><i class="bi bi-calendar2-event me-2 accent"></i>CampusConnect</div>
            <div>
                <h1>Every campus event, in one place.</h1>
                <p class="mt-3 opacity-75">Find events, secure your seat, and check in with a code.</p>
            </div>
            <small class="opacity-50">&copy; CampusConnect</small>
        </aside>
        <main class="auth-form">
            <div class="card-soft">
                <h2 class="h3">Create your account</h2>
                <p class="text-muted">We'll email you a link to verify your address.</p>
                <form id="registerForm" novalidate>
                    <div class="row g-3">
                        <div class="col-12"><label class="form-label" for="full_name">Full name</label><input
                                class="form-control" id="full_name" required></div>
                        <div class="col-md-6"><label class="form-label" for="email">Email address</label><input
                                class="form-control" id="email" type="email" required></div>
                        <div class="col-md-6"><label class="form-label" for="student_id">Student ID</label><input
                                class="form-control" id="student_id" required></div>
                        <div class="col-md-6"><label class="form-label" for="faculty">Faculty</label><input
                                class="form-control" id="faculty" required></div>
                        <div class="col-md-6"><label class="form-label" for="department">Department</label><input
                                class="form-control" id="department" required></div>
                        <div class="col-md-6"><label class="form-label" for="level">Level</label>
                            <select class="form-select" id="level" required>
                                <option value="">Select level</option>
                                <option>100</option>
                                <option>200</option>
                                <option>300</option>
                                <option>400</option>
                                <option>500</option>
                                <option>Postgraduate</option>
                            </select>
                        </div>
                        <div class="col-md-6"><label class="form-label" for="phone">Phone number</label><input
                                class="form-control" id="phone" type="tel" required></div>
                        <div class="col-12"><label class="form-label" for="password">Password (min. 8
                                characters)</label><input class="form-control" id="password" type="password"
                                minlength="8" required autocomplete="new-password"></div>
                        <div class="col-12"><button class="btn btn-primary w-100" id="submitBtn" type="submit">Create
                                account</button></div>
                    </div>
                </form>
                <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="login.html">Sign in</a></p>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/auth/register-page.js"></script>
</body>

</html>
